# config/tfcs-fleet-tui.toml
#
# Hardwired config for the fleet health dashboard.
# The TUI reads this path directly; there is no CLI config override.

# TEMPORARY AIRPLANE-WIFI HACK:
# Prometheus on scott is currently bound to 127.0.0.1 (despite the systemd
# override comment claiming otherwise — see hrdag-ansible#474). For now,
# run a thin SSH tunnel:
#
#     ssh -L 9090:127.0.0.1:9090 scott
#
# Then the TUI can query the local forwarded port below. Once #474 lands,
# point this at http://scott.hrdag.net:9090.
prometheus_url = "http://127.0.0.1:9090"
refresh_seconds = 10
stale_after_seconds = 120
# Per-host thermal thresholds (warn/crit) are loaded from server-documentation
# at startup. Cells turn yellow/red when their raw value crosses the floor
# warning_max / critical_max across the devices declared in
# server-documentation/machines/<host>.yaml. Filesystem-fullness and load
# thresholds are intentionally NOT here yet — they depend on pool composition
# and workload class, not device model. Open design: a per-host operational
# `thresholds:` block in machines/<host>.yaml upstream.
server_documentation_path = "../server-documentation"

[tfcs]
# TEMPORARY DIRECT STATUS POLLING:
# Pull source/count/rate is visible in tfcs /status, but not yet exported
# through Prometheus. Keep this as the only non-Prometheus runtime data
# path until ../tfcs exports "who is pulling from me" metrics that scott
# can scrape. Hosts with no `tfcs_status` field below are not polled.
port = 8099

[display]
sort = "fixed"
temperature_unit = "celsius"

[columns]
enabled = [
    "host", "last", "up", "load",
    "cpu_temp", "hdd_temp", "ssd_temp", "nvme_temp", "nic",
    "root", "data", "tfcs_pulls", "note",
]

# One block per host. `sensors` defaults to all true; declare false to mark a
# physical absence (no spinning HDD, no NIC hwmon chip, etc.) so cells render
# as `--` rather than `?`. `tfcs_status` is the FQDN to poll on tfcs.port for
# pull activity; omit if the host doesn't run tfcs.

[hosts.scott]
instance = "127.0.0.1:9100"
tfcs_status = "scott.hrdag.net"
mounts = { root = "/var", data = "/home" }

[hosts.chll]
instance = "chll.hrdag.net:9100"
tfcs_status = "chll.hrdag.net"
mounts = { root = "/home", data = "/storage" }
sensors = { nic = false }

[hosts.pihost]
instance = "pihost.hrdag.net:9100"
tfcs_status = "pihost.hrdag.net"
mounts = { root = "/", data = "/" }
sensors = { nic = false }

[hosts.meerkat]
instance = "meerkat.hrdag.net:9100"
tfcs_status = "meerkat.hrdag.net"
mounts = { root = "/", data = "/" }
sensors = { nic = false }

[hosts.snowball]
instance = "snowball.hrdag.net:9100"
tfcs_status = "snowball.hrdag.net"
mounts = { root = "/", data = "/data/tfcs" }

[hosts.lizo]
instance = "lizo.hrdag.net:9100"
