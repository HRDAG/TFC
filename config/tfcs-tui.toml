# config/tfcs-tui.toml
#
# Minimal config for the tfcs dashboard TUI.
# Install to /etc/hrdag/tfcs-tui.toml on each machine that runs the dashboard.

bootstrap_peers = [
    "scott.hrdag.net:8098",
    "chll.hrdag.net:8098",
    "pihost.hrdag.net:8098",
    "meerkat.hrdag.net:8098",
    "snowball.hrdag.net:8098",
    "lizo.hrdag.net:8098",
    "lilpig.hrdag.net:8098",
    "ben.hrdag.net:8098",
    "ida.hrdag.net:8098",
    "ant.hrdag.net:8098",
    "dwight.hrdag.net:8098",
]

# Nodes permanently removed from service. Ignore stale references returned by
# peers' /nodes endpoints so auto-discovery cannot add them back to the TUI.
retired_peers = ["ipfs1.hrdag.net"]

http_port = 8099
ntx_port = 9401
target_copies = 4
refresh_seconds = 10

# Peer auto-discovery: hosts seen in /nodes responses but not in bootstrap_peers
# are added as "discovered". Discovered hosts that fail to respond for
# backoff_failures consecutive polls are paused; at evict_failures they are
# removed from the live list. Bootstrap peers are always polled and never evicted.
backoff_failures = 3
evict_failures = 10

# ntx_hosts is derived automatically from /status responses where node_class
# is 'active' or 'anchor'. Override here only if you need to pin a specific
# host list (e.g. for testing a subset of the cluster).
